<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>貼貼研究社｜出貨單轉換工具</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f4ef;margin:0;color:#222}.wrap{max-width:820px;margin:36px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:18px}.spec{background:#fff7df;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}.drop{border:2px dashed #aaa;border-radius:14px;padding:30px;text-align:center;background:#fafafa}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#222;color:#fff;margin:8px 6px 0 0}button:disabled{opacity:.45;cursor:not-allowed}.download{display:none;background:#087f5b;text-decoration:none}#status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap;line-height:1.6}#err{margin-top:10px;color:#b00020;white-space:pre-wrap;font-size:13px}#preview{margin-top:16px;font-size:14px;line-height:1.7;max-height:280px;overflow:auto;border-top:1px solid #ddd;padding-top:12px}.order{margin-bottom:12px}.order b{display:block}</style>
</head>
<body><div class="wrap"><div class="card">
<h1>貼貼研究社｜出貨單轉換工具</h1>
<div class="sub">蝦皮「寄件單＋撿貨單 PDF」→ 100×150mm</div>
<div class="spec"><b>目前版型：</b>上方完整寄件標籤；下方精簡撿貨明細。第一張最多 8 項，5～8 項自動雙欄；第 9 項起整筆移到第 2 張，不切斷單一品項。PDF 每頁固定 100×150mm。</div>
<div class="drop"><b>選擇蝦皮 PDF</b><br><input id="file" type="file" accept="application/pdf"></div>
<div><button id="parse">① 解析 PDF</button><button id="make" disabled>② 產生 100×150mm PDF</button><a id="download" class="btn download">③ 下載 PDF</a></div>
<div id="status">工具載入中…</div><div id="err"></div><div id="preview"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $=id=>document.getElementById(id);let sourceBytes,pdfjsDoc,orders=[];const MM=72/25.4,W=100*MM,H=150*MM;
function status(s){$('status').textContent=s}function fail(e){$('err').textContent=e?.stack||String(e);status('處理失敗：\n'+(e.message||e))}function norm(s){return s.replace(/\s+/g,' ').trim()}
window.addEventListener('load',()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';status('工具載入完成 ✓\n輸出固定 100 × 150 mm。')});
function getOrder(t){t=norm(t);let m=t.match(/蝦皮\s*訂單\s*編號\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/\b(26\d{4}[A-Z0-9]{7,12})\b/i);return m?m[1]:null}
function simplifyTitle(s){s=norm(s).replace(/^台灣現貨\s*[｜|]?\s*/,'').replace(/^水晶轉印貼紙\s*[｜|]?\s*/,'');s=s.split(/水晶轉印貼紙|水晶轉印|UV透明貼紙|透明轉印貼|透明感裝飾貼紙|透明感裝飾貼|透明無白邊|防水耐刮|防水耐磨|DIY防水裝飾貼|DIY裝飾貼紙|DIY裝飾貼|手機殼貼紙|手帳貼紙|10×15cm/)[0];return s.replace(/[｜|\-・／/\s]+$/g,'').trim()}
function extractTableItems(items){const hp=items.find(i=>i.str.trim()==='商品名稱'),hs=items.find(i=>i.str.trim()==='商品規格名稱'),hq=items.find(i=>i.str.trim()==='數量'),ht=items.find(i=>i.str.trim()==='總計');if(!hp||!hs||!hq||!ht)return[];const px=hp.transform[4],sx=hs.transform[4],qx=hq.transform[4],hy=hq.transform[5];const qs=items.filter(i=>/^\d+$/.test(i.str.trim())&&Math.abs(i.transform[4]-qx)<18&&i.transform[5]<hy-2).map(i=>({y:i.transform[5],qty:+i.str.trim()})).filter(x=>x.qty>0&&x.qty<100).sort((a,b)=>b.y-a.y);let out=[];for(let r=0;r<qs.length;r++){const top=qs[r].y+3,bottom=r<qs.length-1?qs[r+1].y+3:qs[r].y-120;const prod=items.filter(i=>i.transform[4]>=px-4&&i.transform[4]<sx-10&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');const spec=items.filter(i=>i.transform[4]>=sx-4&&i.transform[4]<qx-8&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');let series=simplifyTitle(prod),sp=norm(spec);if(/^\d+$/.test(sp))sp='';let name=series;if(sp&&norm(series).toLowerCase()!==sp.toLowerCase()&&!norm(series).includes(sp))name=series+'｜'+sp;if(!name)name=sp||'商品';out.push({name,qty:qs[r].qty})}return out}
function mergeItems(arr){const m=new Map();for(const x of arr)m.set(x.name,(m.get(x.name)||0)+x.qty);return[...m].map(([name,qty])=>({name,qty}))}
function renderPreview(){let h='';orders.slice(0,8).forEach(o=>h+='<div class="order"><b>'+o.order+'</b>'+o.items.map(x=>x.name+' ×'+x.qty).join('<br>')+'</div>');$('preview').innerHTML=h}
$('parse').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;$('preview').innerHTML='';const f=$('file').files[0];if(!f)throw new Error('請先選擇 PDF。');sourceBytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;orders=[];let current=null;for(let p=1;p<=pdfjsDoc.numPages;p++){status(`正在解析 ${p} / ${pdfjsDoc.numPages} 頁…`);const pg=await pdfjsDoc.getPage(p),tc=await pg.getTextContent(),raw=tc.items.map(x=>x.str).join('\n'),oid=getOrder(raw),its=extractTableItems(tc.items);if(oid){current={order:oid,pages:[p-1],items:[...its]};orders.push(current)}else if(current&&its.length){current.pages.push(p-1);current.items.push(...its)}}orders.forEach(o=>o.items=mergeItems(o.items));if(!orders.length)throw new Error('找不到訂單編號。');renderPreview();status(`解析完成 ✓\n共 ${orders.length} 筆訂單。\n第一張最多 8 項，第 9 項起另開一張。`);$('make').disabled=false}catch(e){fail(e)}};
function boxes(pg){pg.setMediaBox(0,0,W,H);pg.setCropBox(0,0,W,H);pg.setTrimBox(0,0,W,H);pg.setBleedBox(0,0,W,H);pg.setArtBox(0,0,W,H)}
function fitFont(ctx,text,maxWidth,start,min){let fs=start;while(fs>min){ctx.font=`${fs}px "Microsoft JhengHei",sans-serif`;if(ctx.measureText(text).width<=maxWidth)break;fs-=1}return fs}
function pickCanvas(order,items,no,count,isFirst){const cols=(isFirst&&items.length>4)||(!isFirst&&items.length>8)?2:1;const rows=Math.ceil(items.length/cols);const c=document.createElement('canvas');c.width=1200;c.height=isFirst?520:900;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font='bold 36px "Microsoft JhengHei",sans-serif';x.fillText(`撿貨明細 ${no}/${count}`,26,42);x.font='24px Arial';x.fillText(order,760,42);x.strokeStyle='#999';x.lineWidth=2;x.beginPath();x.moveTo(26,62);x.lineTo(1172,62);x.stroke();const left=34,top=105,colW=cols===2?570:1130,rowH=(c.height-top-20)/Math.max(rows,1);for(let i=0;i<items.length;i++){const col=cols===2?(i>=rows?1:0):0,row=cols===2?(i%rows):i,it=items[i],baseX=left+col*colW,y=top+row*rowH;const qty='×'+it.qty,qtyW=85,nameMax=colW-qtyW-28;let fs=cols===2?30:36;fs=fitFont(x,it.name,nameMax,fs,21);x.font=`${fs}px "Microsoft JhengHei",sans-serif`;x.fillText(it.name,baseX,y);x.font=`bold ${fs}px Arial`;x.fillText(qty,baseX+colW-qtyW,y)}return c}
async function shippingLabelPng(pageIndex){const p=await pdfjsDoc.getPage(pageIndex+1),vp=p.getViewport({scale:2});const full=document.createElement('canvas');full.width=Math.ceil(vp.width);full.height=Math.ceil(vp.height);await p.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;const sx=Math.round(full.width*0.008),sy=Math.round(full.height*0.004),sw=Math.round(full.width*0.365),sh=Math.round(full.height*0.345);const crop=document.createElement('canvas');crop.width=sw;crop.height=sh;crop.getContext('2d').drawImage(full,sx,sy,sw,sh,0,0,sw,sh);return crop.toDataURL('image/png')}
$('make').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;const{PDFDocument}=PDFLib,out=await PDFDocument.create();let total=0;for(let i=0;i<orders.length;i++){status(`正在產生 ${i+1} / ${orders.length} 筆…`);await new Promise(r=>setTimeout(r,0));const o=orders[i],firstCap=8,nextCap=16,chunks=o.items.length<=firstCap?[o.items]:[o.items.slice(0,firstCap),...Array.from({length:Math.ceil((o.items.length-firstCap)/nextCap)},(_,j)=>o.items.slice(firstCap+j*nextCap,firstCap+(j+1)*nextCap))];for(let ci=0;ci<chunks.length;ci++){const pg=out.addPage([W,H]);boxes(pg);let pickTop=H-3*MM;if(ci===0){const labelData=await shippingLabelPng(o.pages[0]),label=await out.embedPng(labelData);const maxW=76*MM,maxH=96*MM,sc=Math.min(maxW/label.width,maxH/label.height),dw=label.width*sc,dh=label.height*sc,dx=(W-dw)/2,dy=H-2*MM-dh;pg.drawImage(label,{x:dx,y:dy,width:dw,height:dh});pickTop=dy-1.2*MM}const c=pickCanvas(o.order,chunks[ci],ci+1,chunks.length,ci===0),png=await out.embedPng(c.toDataURL('image/png')),maxW=96*MM,bottom=2*MM,avail=Math.max(18*MM,pickTop-bottom),sc2=Math.min(maxW/png.width,avail/png.height),pw=png.width*sc2,ph=png.height*sc2,px=(W-pw)/2,py=pickTop-ph;pg.drawImage(png,{x:px,y:py,width:pw,height:ph});total++}}const bytes=await out.save({useObjectStreams:false}),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=$('download');a.href=url;a.download='貼貼研究社_100x150mm_寄件單＋精簡明細.pdf';a.style.display='inline-block';status(`產生完成 ✓\n${orders.length} 筆訂單，共 ${total} 張。\n第一張最多 8 項；第 9 項起另開一張，單一品項不會被切斷。`)}catch(e){fail(e)}finally{$('make').disabled=false}};
</script></body></html>
