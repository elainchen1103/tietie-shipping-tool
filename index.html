<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貼貼研究社｜出貨單轉換工具</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f4ef;margin:0;color:#222}.wrap{max-width:820px;margin:36px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:18px}.spec{background:#fff7df;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}.drop{border:2px dashed #aaa;border-radius:14px;padding:30px;text-align:center;background:#fafafa}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#222;color:#fff;margin:8px 6px 0 0}button:disabled{opacity:.45;cursor:not-allowed}.download{display:none;background:#087f5b;text-decoration:none}#status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap;line-height:1.6}#err{margin-top:10px;color:#b00020;white-space:pre-wrap;font-size:13px}#preview{margin-top:16px;font-size:14px;line-height:1.7;max-height:280px;overflow:auto;border-top:1px solid #ddd;padding-top:12px}.order{margin-bottom:12px}.order b{display:block}</style></head><body><div class="wrap"><div class="card"><h1>貼貼研究社｜出貨單轉換工具</h1><div class="sub">蝦皮「寄件單＋撿貨單 PDF」→ 100×150mm</div><div class="spec"><b>新版版型：</b>物流單保留完整 QR Code／條碼／門市資訊，約 7×9cm；撿貨明細直接接在下方；超過 4 個品項自動拆第 2 張。</div><div class="drop"><b>選擇蝦皮 PDF</b><br><input id="file" type="file" accept="application/pdf"></div><div><button id="parse">① 解析 PDF</button><button id="make" disabled>② 產生 100×150mm PDF</button><a id="download" class="btn download">③ 下載 PDF</a></div><div id="status">工具載入中…</div><div id="err"></div><div id="preview"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const $=id=>document.getElementById(id);let sourceBytes,pdfjsDoc,orders=[];const MM=72/25.4,W=100*MM,H=150*MM;function status(s){$('status').textContent=s}function fail(e){$('err').textContent=e?.stack||String(e);status('處理失敗：\n'+(e.message||e))}function norm(s){return s.replace(/\s+/g,' ').trim()}window.addEventListener('load',()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';status('工具載入完成 ✓\n輸出固定 100 × 150 mm。')});function getOrder(t){t=norm(t);let m=t.match(/蝦皮\s*訂單\s*編號\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/\b(26\d{4}[A-Z0-9]{7,12})\b/i);return m?m[1]:null}function simplifyTitle(s){s=norm(s).replace(/^台灣現貨\s*[｜|]?\s*/,'').replace(/^水晶轉印貼紙\s*[｜|]?\s*/,'');s=s.split(/水晶轉印貼紙|水晶轉印|UV透明貼紙|透明轉印貼|透明感裝飾貼紙|透明感裝飾貼|透明無白邊|防水耐刮|防水耐磨|DIY防水裝飾貼|DIY裝飾貼紙|DIY裝飾貼|手機殼貼紙|手帳貼紙|10×15cm/)[0];return s.replace(/[｜|\-・／/\s]+$/g,'').trim()}function extractTableItems(items){const hp=items.find(i=>i.str.trim()==='商品名稱'),hs=items.find(i=>i.str.trim()==='商品規格名稱'),hq=items.find(i=>i.str.trim()==='數量'),ht=items.find(i=>i.str.trim()==='總計');if(!hp||!hs||!hq||!ht)return[];const px=hp.transform[4],sx=hs.transform[4],qx=hq.transform[4],hy=hq.transform[5];const qs=items.filter(i=>/^\d+$/.test(i.str.trim())&&Math.abs(i.transform[4]-qx)<18&&i.transform[5]<hy-2).map(i=>({y:i.transform[5],qty:+i.str.trim()})).filter(x=>x.qty>0&&x.qty<100).sort((a,b)=>b.y-a.y);let out=[];for(let r=0;r<qs.length;r++){const top=qs[r].y+3,bottom=r<qs.length-1?qs[r+1].y+3:qs[r].y-120;const prod=items.filter(i=>i.transform[4]>=px-4&&i.transform[4]<sx-10&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');const spec=items.filter(i=>i.transform[4]>=sx-4&&i.transform[4]<qx-8&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');let series=simplifyTitle(prod),sp=norm(spec);if(/^\d+$/.test(sp))sp='';let name=series;if(sp&&norm(series).toLowerCase()!==sp.toLowerCase()&&!norm(series).includes(sp))name=series+'｜'+sp;if(!name)name=sp||'商品';out.push({name,qty:qs[r].qty})}return out}function mergeItems(arr){const m=new Map();for(const x of arr)m.set(x.name,(m.get(x.name)||0)+x.qty);return[...m].map(([name,qty])=>({name,qty}))}function renderPreview(){let h='';orders.slice(0,8).forEach(o=>h+='<div class="order"><b>'+o.order+'</b>'+o.items.map(x=>x.name+' ×'+x.qty).join('<br>')+'</div>');$('preview').innerHTML=h}$('parse').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;$('preview').innerHTML='';const f=$('file').files[0];if(!f)throw new Error('請先選擇 PDF。');sourceBytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;orders=[];let current=null;for(let p=1;p<=pdfjsDoc.numPages;p++){status(`正在解析 ${p} / ${pdfjsDoc.numPages} 頁…`);const pg=await pdfjsDoc.getPage(p),tc=await pg.getTextContent(),raw=tc.items.map(x=>x.str).join('\n'),oid=getOrder(raw),its=extractTableItems(tc.items);if(oid){current={order:oid,pages:[p-1],items:[...its]};orders.push(current)}else if(current&&its.length){current.pages.push(p-1);current.items.push(...its)}}orders.forEach(o=>o.items=mergeItems(o.items));if(!orders.length)throw new Error('找不到訂單編號。');renderPreview();status(`解析完成 ✓\n共 ${orders.length} 筆訂單。\n可先確認下方精簡名稱，再按「② 產生」。`);$('make').disabled=false}catch(e){fail(e)}};function pickCanvas(order,items,no,count){const fs=items.length<=3?44:38,row=fs+22,head=92,h=Math.max(180,head+items.length*row+24),c=document.createElement('canvas');c.width=1200;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,h);x.fillStyle='#111';x.font='bold 38px "Microsoft JhengHei",sans-serif';x.fillText(`撿貨明細 ${no}/${count}`,28,45);x.font='26px Arial';x.fillText(order,760,45);x.strokeStyle='#999';x.beginPath();x.moveTo(28,66);x.lineTo(1170,66);x.stroke();let y=112;x.font=`${fs}px "Microsoft JhengHei",sans-serif`;for(const it of items){let n=it.name.length>24?it.name.slice(0,24)+'…':it.name;x.fillText(n,34,y);x.font=`bold ${fs}px Arial`;x.fillText('×'+it.qty,1040,y);x.font=`${fs}px "Microsoft JhengHei",sans-serif`;y+=row}return c}function boxes(pg){pg.setMediaBox(0,0,W,H);pg.setCropBox(0,0,W,H);pg.setTrimBox(0,0,W,H);pg.setBleedBox(0,0,W,H);pg.setArtBox(0,0,W,H)}$('make').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;const{PDFDocument}=PDFLib,src=await PDFDocument.load(sourceBytes.slice()),out=await PDFDocument.create();let total=0;for(let i=0;i<orders.length;i++){status(`正在產生 ${i+1} / ${orders.length} 筆…`);await new Promise(r=>setTimeout(r,0));const o=orders[i],chunks=o.items.length<=4?[o.items]:[o.items.slice(0,4),...Array.from({length:Math.ceil((o.items.length-4)/9)},(_,j)=>o.items.slice(4+j*9,13+j*9))];for(let ci=0;ci<chunks.length;ci++){const pg=out.addPage([W,H]);boxes(pg);let pickTop=H-3*MM;if(ci===0){const sp=src.getPage(o.pages[0]),sz=sp.getSize();const cropLeft=0,cropRight=sz.width*0.40,cropBottom=sz.height*0.64,cropTop=sz.height;const emb=await out.embedPage(sp,{left:cropLeft,bottom:cropBottom,right:cropRight,top:cropTop});const maxW=94*MM,maxH=92*MM,sc=Math.min(maxW/emb.width,maxH/emb.height),dw=emb.width*sc,dh=emb.height*sc,dx=(W-dw)/2,dy=H-2*MM-dh;pg.drawPage(emb,{x:dx,y:dy,width:dw,height:dh});pickTop=dy-2*MM}const c=pickCanvas(o.order,chunks[ci],ci+1,chunks.length),png=await out.embedPng(c.toDataURL('image/png')),maxW=96*MM,bottom=2*MM,avail=Math.max(20*MM,pickTop-bottom),sc2=Math.min(maxW/png.width,avail/png.height),pw=png.width*sc2,ph=png.height*sc2,px=(W-pw)/2,py=pickTop-ph;pg.drawImage(png,{x:px,y:py,width:pw,height:ph});total++}}const bytes=await out.save({useObjectStreams:false}),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=$('download');a.href=url;a.download='貼貼研究社_100x150mm_出貨單.pdf';a.style.display='inline-block';status(`產生完成 ✓\n${orders.length} 筆訂單，共 ${total} 張。\n每頁固定 100 × 150 mm。\n物流單完整保留並放大，撿貨明細緊接下方。`)}catch(e){fail(e)}finally{$('make').disabled=false}};</script></body></html>
