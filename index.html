<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貼貼研究社｜出貨單轉換工具</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f4ef;margin:0;color:#222}.wrap{max-width:820px;margin:36px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:18px}.spec{background:#fff7df;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.6}.drop{border:2px dashed #aaa;border-radius:14px;padding:24px;text-align:center;background:#fafafa}.type{margin-bottom:18px}.type label{font-weight:700;margin-right:8px}.type select{font-size:16px;padding:10px 12px;border:1px solid #aaa;border-radius:9px;min-width:280px}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#222;color:#fff;margin:8px 6px 0 0}button:disabled{opacity:.45}.download{display:none;background:#087f5b;text-decoration:none}#status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap;line-height:1.6}#err{margin-top:10px;color:#b00020;white-space:pre-wrap;font-size:13px}#preview{margin-top:16px;font-size:14px;line-height:1.7;max-height:300px;overflow:auto;border-top:1px solid #ddd;padding-top:12px}.order{margin-bottom:12px}.order b{display:block}</style></head><body><div class="wrap"><div class="card"><h1>貼貼研究社｜出貨單轉換工具</h1><div class="sub">蝦皮 PDF → 100×150mm 熱感標籤</div><div class="type"><label for="mode">物流／文件類型</label><select id="mode"><option value="store">蝦皮店到店｜寄件單＋撿貨單</option><option value="home">店到家宅配｜寄件單＋裝箱單</option><option value="hct">新竹物流｜裝箱單</option></select></div><div id="spec" class="spec"></div><div class="drop"><b>選擇蝦皮 PDF</b><br><input id="file" type="file" accept="application/pdf"></div><div><button id="parse">① 解析 PDF</button><button id="make" disabled>② 產生 100×150mm PDF</button><a id="download" class="btn download">③ 下載 PDF</a></div><div id="status">工具載入中…</div><div id="err"></div><div id="preview"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>
const $=id=>document.getElementById(id);let sourceBytes,pdfjsDoc,orders=[];const MM=72/25.4,W=100*MM,H=150*MM;
function status(s){$('status').textContent=s}function fail(e){$('err').textContent=e?.stack||String(e);status('處理失敗：\n'+(e.message||e))}function norm(s){return String(s||'').replace(/\s+/g,' ').trim()}
function modeInfo(){const m=$('mode').value;if(m==='hct')$('spec').innerHTML='<b>新竹物流：</b>只輸出精簡撿貨明細，不顯示訂單編號。每張最多 12 項，單欄粗黑大字。';else if(m==='home')$('spec').innerHTML='<b>店到家宅配：</b>寄件單固定同一尺寸與頂端位置，明細固定從同一位置開始。1～8 項同張；9 項以上明細移到第二張。';else $('spec').innerHTML='<b>蝦皮店到店：</b>1～8 項＝寄件單＋精簡明細同張；9 項以上＝第一張只放寄件單，全部明細從第二張開始。'}
$('mode').onchange=()=>{modeInfo();$('make').disabled=true;$('preview').innerHTML='';status('已切換文件類型，請重新解析 PDF。')};window.addEventListener('load',()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';modeInfo();status('工具載入完成 ✓\n輸出固定 100 × 150 mm。')});
function getOrder(t){t=norm(t);let m=t.match(/蝦皮\s*訂單\s*編號\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/訂單編號\s*\(單\)\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/\b(26\d{4}[A-Z0-9]{7,12})\b/i);return m?m[1]:null}
function simplifyTitle(s){s=norm(s).replace(/^台灣現貨\s*[｜|]?\s*/,'');s=s.split(/水晶轉印貼紙|水晶轉印|UV透明貼紙|透明轉印貼|透明感裝飾貼紙|透明感裝飾貼|透明無白邊|防水耐刮|防水耐磨|DIY防水裝飾貼紙|DIY防水裝飾貼|DIY裝飾貼紙|DIY裝飾貼|手機殼貼紙|手帳貼紙|10×15cm/)[0];return s.replace(/[｜|\-・／/\s]+$/g,'').trim()}
function cleanField(s){s=norm(s);s=s.replace(/\s*\(?單\)?\s*[:：].*$/i,'');s=s.replace(/\s*訂單編號.*$/i,'');s=s.replace(/\s*package\s*\d*.*$/i,'');s=s.replace(/\s*買家備註.*$/i,'');return norm(s)}
function extractTableItems(items){const hp=items.find(i=>i.str.trim()==='商品名稱'),hs=items.find(i=>i.str.trim()==='商品規格名稱'),hq=items.find(i=>i.str.trim()==='數量'),ht=items.find(i=>i.str.trim()==='總計');if(!hp||!hs||!hq||!ht)return[];const px=hp.transform[4],sx=hs.transform[4],qx=hq.transform[4],hy=hq.transform[5];const qs=items.filter(i=>/^\d+$/.test(i.str.trim())&&Math.abs(i.transform[4]-qx)<20&&i.transform[5]<hy-2).map(i=>({y:i.transform[5],qty:+i.str.trim()})).filter(x=>x.qty>0&&x.qty<100).sort((a,b)=>b.y-a.y);let out=[];for(let r=0;r<qs.length;r++){const top=qs[r].y+4,bottom=r<qs.length-1?qs[r+1].y+4:qs[r].y-130;const prod=items.filter(i=>i.transform[4]>=px-5&&i.transform[4]<sx-8&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');const spec=items.filter(i=>i.transform[4]>=sx-5&&i.transform[4]<qx-7&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');let series=cleanField(simplifyTitle(prod)),sp=cleanField(spec);if(/^\d+$/.test(sp))sp='';let name=series;if(sp&&series.toLowerCase()!==sp.toLowerCase()&&!series.includes(sp))name=series+'｜'+sp;name=cleanField(name);if(!name)name=sp||'商品';out.push({name,qty:qs[r].qty})}return out}
function mergeItems(arr){const m=new Map();for(const x of arr)m.set(x.name,(m.get(x.name)||0)+x.qty);return[...m].map(([name,qty])=>({name,qty}))}
function renderPreview(){const hct=$('mode').value==='hct';let h='';orders.slice(0,10).forEach(o=>h+='<div class="order">'+(hct?'':'<b>'+o.order+'</b>')+o.items.map((x,i)=>(i+1)+'. '+x.name+' ×'+x.qty).join('<br>')+'</div>');$('preview').innerHTML=h}
$('parse').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;$('preview').innerHTML='';const f=$('file').files[0];if(!f)throw new Error('請先選擇 PDF。');sourceBytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;orders=[];let current=null;for(let p=1;p<=pdfjsDoc.numPages;p++){status(`正在解析 ${p} / ${pdfjsDoc.numPages} 頁…`);const pg=await pdfjsDoc.getPage(p),tc=await pg.getTextContent(),raw=tc.items.map(x=>x.str).join('\n'),oid=getOrder(raw),its=extractTableItems(tc.items);if(oid){let existing=orders.find(o=>o.order===oid);if(existing){existing.pages.push(p-1);existing.items.push(...its);current=existing}else{current={order:oid,pages:[p-1],items:[...its]};orders.push(current)}}else if(current&&its.length){current.pages.push(p-1);current.items.push(...its)}}orders.forEach(o=>o.items=mergeItems(o.items));if(!orders.length)throw new Error('找不到訂單編號，請確認文件類型與 PDF。');renderPreview();status(`解析完成 ✓\n共 ${orders.length} 筆訂單。`);$('make').disabled=false}catch(e){fail(e)}};
function boxes(pg){pg.setMediaBox(0,0,W,H);pg.setCropBox(0,0,W,H);pg.setTrimBox(0,0,W,H);pg.setBleedBox(0,0,W,H);pg.setArtBox(0,0,W,H)}
function pickCanvas(order,items,no,count,compact,hct=false,startNumber=1){const c=document.createElement('canvas');c.width=1000;c.height=compact?610:1100;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.textBaseline='alphabetic';x.font='900 48px "Microsoft JhengHei",Arial,sans-serif';x.fillText(hct?'撿貨明細':`撿貨明細${count>1?' '+no+'/'+count:''}`,28,54);if(!hct){x.font='900 28px Arial,sans-serif';x.textAlign='right';x.fillText(order,972,51);x.textAlign='left'}x.strokeStyle='#111';x.lineWidth=4;x.beginPath();x.moveTo(28,76);x.lineTo(972,76);x.stroke();const top=132,bottom=24,rows=Math.max(items.length,1),rowH=(c.height-top-bottom)/rows;const baseFs=hct?(items.length<=8?52:items.length<=10?49:46):(compact?54:(items.length<=8?62:items.length<=10?56:50));for(let i=0;i<items.length;i++){const it=items[i],y=top+i*rowH+Math.min(rowH*.64,58),qty='×'+it.qty;let label=`${startNumber+i}. ${it.name}`;x.font=`900 ${baseFs}px "Microsoft JhengHei",Arial,sans-serif`;while(x.measureText(label).width>825&&label.length>8)label=label.slice(0,-2)+'…';x.fillStyle='#111';x.fillText(label,32,y);x.font=`900 ${baseFs+8}px Arial,sans-serif`;x.textAlign='right';x.fillText(qty,970,y);x.textAlign='left';if(i<items.length-1){const lineY=top+(i+1)*rowH-4;x.strokeStyle='#555';x.lineWidth=2.5;x.beginPath();x.moveTo(30,lineY);x.lineTo(970,lineY);x.stroke()}}return c}
async function shippingLabelPng(pageIndex){const p=await pdfjsDoc.getPage(pageIndex+1),vp=p.getViewport({scale:2}),full=document.createElement('canvas');full.width=Math.ceil(vp.width);full.height=Math.ceil(vp.height);await p.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;const home=$('mode').value==='home';const sx=Math.round(full.width*.008),sy=Math.round(full.height*.004),sw=Math.round(full.width*.365),sh=Math.round(full.height*(home?.405:.345)),crop=document.createElement('canvas');crop.width=sw;crop.height=sh;crop.getContext('2d').drawImage(full,sx,sy,sw,sh,0,0,sw,sh);return crop.toDataURL('image/png')}
async function drawLabel(out,pg,pageIndex){const data=await shippingLabelPng(pageIndex),label=await out.embedPng(data),home=$('mode').value==='home';let dw,dh,dx,dy;if(home){dw=76*MM;dh=88*MM;dx=(W-dw)/2;dy=H-2*MM-dh}else{const maxW=74*MM,maxH=84*MM,sc=Math.min(maxW/label.width,maxH/label.height);dw=label.width*sc;dh=label.height*sc;dx=(W-dw)/2;dy=H-2*MM-dh}pg.drawImage(label,{x:dx,y:dy,width:dw,height:dh});return home?59*MM:dy-.7*MM}
async function drawPick(out,pg,order,items,no,count,pickTop,compact,hct=false,startNumber=1){const c=pickCanvas(order,items,no,count,compact,hct,startNumber),png=await out.embedPng(c.toDataURL('image/png')),maxW=97*MM,bottom=1.5*MM,avail=Math.max(20*MM,pickTop-bottom),sc=Math.min(maxW/png.width,avail/png.height),pw=png.width*sc,ph=png.height*sc;pg.drawImage(png,{x:(W-pw)/2,y:pickTop-ph,width:pw,height:ph})}
$('make').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;const{PDFDocument}=PDFLib,out=await PDFDocument.create();let total=0,hct=$('mode').value==='hct';for(let i=0;i<orders.length;i++){status(`正在產生 ${i+1} / ${orders.length} 筆…`);await new Promise(r=>setTimeout(r,0));const o=orders[i];if(hct){const parts=[];for(let k=0;k<o.items.length;k+=12)parts.push(o.items.slice(k,k+12));for(let j=0;j<parts.length;j++){const pg=out.addPage([W,H]);boxes(pg);await drawPick(out,pg,'',parts[j],j+1,parts.length,H-2*MM,false,true,j*12+1);total++}}else if(o.items.length<=8){const pg=out.addPage([W,H]);boxes(pg);const top=await drawLabel(out,pg,o.pages[0]);await drawPick(out,pg,o.order,o.items,1,1,top,true,false,1);total++}else{const labelPage=out.addPage([W,H]);boxes(labelPage);await drawLabel(out,labelPage,o.pages[0]);total++;const parts=[];for(let k=0;k<o.items.length;k+=14)parts.push(o.items.slice(k,k+14));for(let j=0;j<parts.length;j++){const pg=out.addPage([W,H]);boxes(pg);await drawPick(out,pg,o.order,parts[j],j+1,parts.length,H-2*MM,false,false,j*14+1);total++}}}const bytes=await out.save({useObjectStreams:false}),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=$('download'),m=$('mode').value;a.href=url;a.download=m==='hct'?'貼貼研究社_新竹物流_100x150mm_撿貨單.pdf':m==='home'?'貼貼研究社_店到家宅配_100x150mm_寄件單＋精簡明細.pdf':'貼貼研究社_100x150mm_寄件單＋精簡明細.pdf';a.style.display='inline-block';status(`產生完成 ✓\n${orders.length} 筆訂單，共 ${total} 張。\n${m==='home'?'店到家宅配版位已固定。':'明細編號跨頁連續。'}`)}catch(e){fail(e)}finally{$('make').disabled=false}};
</script></body></html>
