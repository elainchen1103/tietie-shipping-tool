<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貼貼研究社｜出貨單轉換工具</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f4ef;margin:0;color:#222}.wrap{max-width:820px;margin:36px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:22px}.spec{background:#fff7df;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}.drop{border:2px dashed #aaa;border-radius:14px;padding:30px;text-align:center;background:#fafafa}button,.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#222;color:#fff;margin:8px 6px 0 0}button:disabled{opacity:.45;cursor:not-allowed}.download{display:none;background:#087f5b;text-decoration:none}#status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap;line-height:1.6}#err{margin-top:10px;color:#b00020;white-space:pre-wrap;font-size:13px}#preview{margin-top:16px;font-size:14px;line-height:1.7;max-height:280px;overflow:auto;border-top:1px solid #ddd;padding-top:12px}.order{margin-bottom:12px}.order b{display:block}</style></head><body><div class="wrap"><div class="card"><h1>貼貼研究社｜出貨單轉換工具</h1><div class="sub">蝦皮「寄件單＋撿貨單 PDF」→ 10×15cm PDF</div><div class="spec"><b>輸出規格：</b>100 × 150 mm 直式｜物流標籤優先放大｜撿貨明細緊接在物流單下方｜內容過多自動拆第 2 張</div><div class="drop"><b>選擇蝦皮 PDF</b><br><input id="file" type="file" accept="application/pdf"></div><div><button id="parse">① 解析 PDF</button><button id="make" disabled>② 產生 10×15cm PDF</button><a id="download" class="btn download">③ 下載 10×15cm PDF</a></div><div id="status">工具載入中…</div><div id="err"></div><div id="preview"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const $=id=>document.getElementById(id);let sourceBytes,pdfjsDoc,orders=[];const PT_PER_MM=72/25.4,PAGE_W=100*PT_PER_MM,PAGE_H=150*PT_PER_MM;function status(s){$('status').textContent=s}function fail(e){$('err').textContent=e?.stack||String(e);status('處理失敗：\n'+(e.message||e))}function norm(s){return s.replace(/\s+/g,' ').trim()}window.addEventListener('load',()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';status('工具載入完成 ✓\n輸出頁面固定為 100 × 150 mm。\n請選擇蝦皮 PDF。')}catch(e){fail(e)}});function getOrder(t){t=norm(t);let m=t.match(/蝦皮\s*訂單\s*編號\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/\b(26\d{4}[A-Z0-9]{7,12})\b/i);return m?m[1]:null}function simplifyTitle(s){s=norm(s).replace(/^台灣現貨\s*[｜|]?\s*/,'').replace(/^水晶轉印貼紙\s*[｜|]?\s*/,'');s=s.split(/水晶轉印貼紙|水晶轉印|UV透明貼紙|透明轉印貼|透明感裝飾貼紙|透明感裝飾貼|透明無白邊|防水耐刮|防水耐磨|DIY防水裝飾貼|DIY裝飾貼紙|DIY裝飾貼|手機殼貼紙|手帳貼紙|10×15cm/)[0];return s.replace(/[｜|\-・／/\s]+$/g,'').trim()}function extractTableItems(items){const hProd=items.find(i=>i.str.trim()==='商品名稱'),hSpec=items.find(i=>i.str.trim()==='商品規格名稱'),hQty=items.find(i=>i.str.trim()==='數量'),hTotal=items.find(i=>i.str.trim()==='總計');if(!hProd||!hSpec||!hQty||!hTotal)return[];const px=hProd.transform[4],sx=hSpec.transform[4],qx=hQty.transform[4],hy=hQty.transform[5];const qs=items.filter(i=>/^\d+$/.test(i.str.trim())&&Math.abs(i.transform[4]-qx)<18&&i.transform[5]<hy-2).map(i=>({y:i.transform[5],qty:+i.str.trim()})).filter(x=>x.qty>0&&x.qty<100).sort((a,b)=>b.y-a.y);let out=[];for(let r=0;r<qs.length;r++){const top=qs[r].y+3,bottom=r<qs.length-1?qs[r+1].y+3:qs[r].y-120;const prod=items.filter(i=>i.transform[4]>=px-4&&i.transform[4]<sx-10&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');const spec=items.filter(i=>i.transform[4]>=sx-4&&i.transform[4]<qx-8&&i.transform[5]<=top&&i.transform[5]>bottom).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('');let series=simplifyTitle(prod),sp=norm(spec);if(/^\d+$/.test(sp))sp='';let name=series;if(sp&&norm(series).toLowerCase()!==sp.toLowerCase()&&!norm(series).includes(sp))name=series+'｜'+sp;if(!name)name=sp||'商品';out.push({name,qty:qs[r].qty})}return out}function mergeItems(arr){const m=new Map();for(const x of arr)m.set(x.name,(m.get(x.name)||0)+x.qty);return[...m].map(([name,qty])=>({name,qty}))}function shippingTopY(items,pageHeight){const marker=items.find(i=>/買家備註/.test(i.str.trim()));if(marker){const y=marker.transform[5]+8;return Math.max(pageHeight*.34,Math.min(pageHeight*.56,y))}return pageHeight*.46}function renderPreview(){let h='';orders.slice(0,8).forEach(o=>{h+='<div class="order"><b>'+o.order+'</b>'+o.items.map(x=>x.name+' ×'+x.qty).join('<br>')+'</div>'});$('preview').innerHTML=h}$('parse').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;$('preview').innerHTML='';const f=$('file').files[0];if(!f)throw new Error('請先選擇 PDF。');sourceBytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;orders=[];let current=null;for(let p=1;p<=pdfjsDoc.numPages;p++){status(`正在解析 ${p} / ${pdfjsDoc.numPages} 頁…`);const pg=await pdfjsDoc.getPage(p),tc=await pg.getTextContent(),raw=tc.items.map(x=>x.str).join('\n'),oid=getOrder(raw),its=extractTableItems(tc.items),viewport=pg.getViewport({scale:1}),shipTop=shippingTopY(tc.items,viewport.height);if(oid){current={order:oid,pages:[p-1],items:[...its],shipTop};orders.push(current)}else if(current&&its.length){current.pages.push(p-1);current.items.push(...its)}}orders.forEach(o=>o.items=mergeItems(o.items));if(!orders.length)throw new Error('找不到訂單編號。');renderPreview();status(`解析完成 ✓\n共 ${orders.length} 筆訂單／原始 ${pdfjsDoc.numPages} 頁。\n輸出固定 100 × 150 mm，物流單會優先放大。`);$('make').disabled=false}catch(e){fail(e)}};function canvasPick(order,items,no,count){const fs=items.length<=4?44:items.length<=6?38:33,row=fs+24,head=105,h=Math.max(180,head+items.length*row+30),c=document.createElement('canvas');c.width=1200;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font='bold 40px "Microsoft JhengHei",sans-serif';x.fillText(`撿貨明細 ${no}/${count}`,34,48);x.font='27px Arial';x.fillText(order,760,48);x.strokeStyle='#999';x.lineWidth=2;x.beginPath();x.moveTo(30,72);x.lineTo(1170,72);x.stroke();let y=115;x.font=`${fs}px "Microsoft JhengHei",sans-serif`;for(const it of items){let n=it.name.length>24?it.name.slice(0,24)+'…':it.name;x.fillText(n,38,y);x.font=`bold ${fs}px Arial`;x.fillText('×'+it.qty,1040,y);x.font=`${fs}px "Microsoft JhengHei",sans-serif`;y+=row}return c}function setExactBoxes(pg){pg.setMediaBox(0,0,PAGE_W,PAGE_H);pg.setCropBox(0,0,PAGE_W,PAGE_H);pg.setBleedBox(0,0,PAGE_W,PAGE_H);pg.setTrimBox(0,0,PAGE_W,PAGE_H);pg.setArtBox(0,0,PAGE_W,PAGE_H)}$('make').onclick=async()=>{try{$('err').textContent='';$('download').style.display='none';$('make').disabled=true;const{PDFDocument}=PDFLib,src=await PDFDocument.load(sourceBytes.slice()),out=await PDFDocument.create();out.setTitle('貼貼研究社 100x150mm 出貨單');out.setSubject('100 × 150 mm thermal shipping labels');let total=0;for(let i=0;i<orders.length;i++){status(`正在產生 ${i+1} / ${orders.length} 筆…`);await new Promise(r=>setTimeout(r,0));const o=orders[i],firstCap=5,nextCap=9,chunks=o.items.length<=firstCap?[o.items]:[o.items.slice(0,firstCap),...Array.from({length:Math.ceil((o.items.length-firstCap)/nextCap)},(_,j)=>o.items.slice(firstCap+j*nextCap,firstCap+(j+1)*nextCap))];for(let ci=0;ci<chunks.length;ci++){const pg=out.addPage([PAGE_W,PAGE_H]);setExactBoxes(pg);let pickTopY=PAGE_H-3*PT_PER_MM;if(ci===0){const sp=src.getPage(o.pages[0]),sz=sp.getSize(),cropTop=Math.max(1,Math.min(sz.height,o.shipTop||sz.height*.46)),emb=await out.embedPage(sp,{left:0,bottom:0,right:sz.width,top:cropTop});const maxW=98*PT_PER_MM,maxH=88*PT_PER_MM,sc=Math.min(maxW/emb.width,maxH/emb.height),dw=emb.width*sc,dh=emb.height*sc,dx=(PAGE_W-dw)/2,dy=PAGE_H-1.5*PT_PER_MM-dh;pg.drawPage(emb,{x:dx,y:dy,width:dw,height:dh});pickTopY=dy-1.5*PT_PER_MM}const c=canvasPick(o.order,chunks[ci],ci+1,chunks.length),png=await out.embedPng(c.toDataURL('image/png')),maxW=98*PT_PER_MM,bottomMargin=2*PT_PER_MM,availableH=Math.max(20*PT_PER_MM,pickTopY-bottomMargin),sc2=Math.min(maxW/png.width,availableH/png.height),pw=png.width*sc2,ph=png.height*sc2,px=(PAGE_W-pw)/2,py=pickTopY-ph;pg.drawImage(png,{x:px,y:py,width:pw,height:ph});total++}}const bytes=await out.save({useObjectStreams:false}),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=$('download');a.href=url;a.download='貼貼研究社_100x150mm_出貨單.pdf';a.style.display='inline-block';status(`產生完成 ✓\n${orders.length} 筆訂單，共 ${total} 張。\nPDF：100 × 150 mm。\n物流單已放大至接近滿版寬度，撿貨明細緊接在下方。\n請按綠色「③ 下載」。`)}catch(e){fail(e)}finally{$('make').disabled=false}};</script></body></html>
