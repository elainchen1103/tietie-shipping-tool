<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貼貼研究社｜出貨單轉換工具</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f4ef;margin:0;color:#222}
.wrap{max-width:780px;margin:36px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:22px}.drop{border:2px dashed #aaa;border-radius:14px;padding:30px;text-align:center;background:#fafafa}
button,.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#222;color:#fff;margin:8px 6px 0 0}
button:disabled{opacity:.45;cursor:not-allowed}.download{display:none;background:#087f5b;text-decoration:none}
#status{margin-top:18px;padding:14px;border-radius:10px;background:#f3f3f3;white-space:pre-wrap;line-height:1.6}
#err{margin-top:10px;color:#b00020;white-space:pre-wrap;font-size:13px}
small{color:#777}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>貼貼研究社｜出貨單轉換工具</h1>
<div class="sub">蝦皮「寄件單＋撿貨單 PDF」→ 10×15cm PDF</div>
<div class="drop">
<div><b>選擇蝦皮 PDF</b></div>
<input id="file" type="file" accept="application/pdf">
</div>
<div>
<button id="parse">① 解析 PDF</button>
<button id="make" disabled>② 產生 10×15cm PDF</button>
<a id="download" class="btn download">③ 下載 10×15cm PDF</a>
</div>
<div id="status">工具載入中…</div>
<div id="err"></div>
<small>所有處理都在瀏覽器內完成，PDF 不會上傳到伺服器。</small>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let sourceBytes=null,pdfjsDoc=null,orders=[];
function status(s){$("status").textContent=s}
function fail(e){$("err").textContent=(e&&e.stack)?e.stack:String(e);status("處理失敗：\n"+(e.message||e))}
function norm(s){return s.replace(/\s+/g," ").trim()}
window.addEventListener("load",()=>{try{if(!window.pdfjsLib)throw new Error("PDF.js 載入失敗，請確認網路連線。");if(!window.PDFLib)throw new Error("PDF-Lib 載入失敗，請確認網路連線。");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";status("工具載入完成 ✓\n請選擇蝦皮 PDF。")}catch(e){fail(e)}});
function getOrder(text){const t=norm(text);let m=t.match(/蝦皮\s*訂單\s*編號\s*[:：]?\s*([0-9A-Z]{10,20})/i);if(!m)m=t.match(/\b(26\d{4}[A-Z0-9]{7,12})\b/i);return m?m[1]:null}
function getTracking(text){const t=norm(text),m=t.match(/寄件\s*編號\s*[:：]?\s*(TW[0-9A-Z]+)/i);return m?m[1]:""}
function extractItems(items){const strs=items.map(x=>x.str.trim()).filter(Boolean);let found=[];for(let i=0;i<strs.length;i++){const s=strs[i];if(!s||/商品名稱|主商品貨號|商品選項貨號|商品規格名稱|數量|總計|買家備註|寄件編號|蝦皮訂單編號/.test(s))continue;for(let j=1;j<=3&&i+j<strs.length;j++){if(/^\d+$/.test(strs[i+j])){let q=parseInt(strs[i+j],10);if(q>=1&&q<=99&&s.length<=28&&!/^\d+$/.test(s)&&!/^TW/.test(s)){if(!/台灣現貨|透明|防水|DIY|手機殼|水壺|筆電|貼紙|賣家|門市|到貨/.test(s))found.push({name:s,qty:q})}break}}}const out=[],seen=new Set();for(const x of found){const k=x.name+"|"+x.qty;if(!seen.has(k)){seen.add(k);out.push(x)}}return out.slice(0,30)}
$("parse").onclick=async()=>{try{$("err").textContent="";$("download").style.display="none";$("make").disabled=true;const f=$("file").files[0];if(!f)throw new Error("請先選擇 PDF。");sourceBytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;orders=[];let current=null;for(let p=1;p<=pdfjsDoc.numPages;p++){status(`正在解析 ${p} / ${pdfjsDoc.numPages} 頁…`);const pg=await pdfjsDoc.getPage(p);const tc=await pg.getTextContent();const raw=tc.items.map(x=>x.str).join("\n");const oid=getOrder(raw);const its=extractItems(tc.items);if(oid){current={order:oid,tracking:getTracking(raw),pages:[p-1],items:[...its]};orders.push(current)}else if(current&&/商品名稱|商品規格名稱|買家備註/.test(raw)){current.pages.push(p-1);current.items.push(...its)}}if(!orders.length)throw new Error("找不到訂單編號，請確認是蝦皮『寄件單＋撿貨單』PDF。");status(`解析完成 ✓\n共 ${orders.length} 筆訂單／原始 ${pdfjsDoc.numPages} 頁。\n請按「② 產生 10×15cm PDF」。`);$("make").disabled=false}catch(e){fail(e)}};
function makePickCanvas(order,items,pageNo,pageCount){const c=document.createElement("canvas");c.width=1200;c.height=650;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#111";x.font='bold 42px "Microsoft JhengHei","Noto Sans TC",sans-serif';x.fillText(`撿貨明細 ${pageNo}/${pageCount}`,40,60);x.font='28px Arial,sans-serif';x.fillText(order,760,58);x.strokeStyle="#999";x.lineWidth=2;x.beginPath();x.moveTo(35,82);x.lineTo(1165,82);x.stroke();let y=130;const fs=items.length<=6?40:items.length<=9?34:29;x.font=`${fs}px "Microsoft JhengHei","Noto Sans TC",sans-serif`;for(const it of items){const qty=`×${it.qty}`;const maxName=it.name.length>22?it.name.slice(0,22)+"…":it.name;x.fillStyle="#111";x.fillText(maxName,45,y);x.font=`bold ${fs}px Arial,sans-serif`;x.fillText(qty,1030,y);x.font=`${fs}px "Microsoft JhengHei","Noto Sans TC",sans-serif`;y+=fs+20}return c}
$("make").onclick=async()=>{try{$("err").textContent="";$("download").style.display="none";$("make").disabled=true;const{PDFDocument}=PDFLib;const src=await PDFDocument.load(sourceBytes.slice());const out=await PDFDocument.create();const W=283.4646,H=425.1969;let totalPages=0;for(let i=0;i<orders.length;i++){status(`正在產生 ${i+1} / ${orders.length} 筆…`);await new Promise(r=>setTimeout(r,0));const o=orders[i];let chunks=[];if(o.items.length<=7)chunks=[o.items];else{chunks=[o.items.slice(0,7)];for(let k=7;k<o.items.length;k+=10)chunks.push(o.items.slice(k,k+10))}if(!chunks.length)chunks=[[]];for(let ci=0;ci<chunks.length;ci++){const pg=out.addPage([W,H]);if(ci===0){const[emb]=await out.embedPdf(src,[o.pages[0]]);const topH=275;const sc=Math.min(W/emb.width,topH/emb.height);const ew=emb.width*sc,eh=emb.height*sc;pg.drawPage(emb,{x:(W-ew)/2,y:H-eh,width:ew,height:eh})}const canvas=makePickCanvas(o.order,chunks[ci],ci+1,chunks.length);const png=await out.embedPng(canvas.toDataURL("image/png"));const boxH=ci===0?145:H-12,boxY=ci===0?0:6,sc2=Math.min((W-8)/png.width,boxH/png.height),pw=png.width*sc2,ph=png.height*sc2;pg.drawImage(png,{x:(W-pw)/2,y:boxY+(boxH-ph)/2,width:pw,height:ph});totalPages++}}const bytes=await out.save();const blob=new Blob([bytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);const a=$("download");a.href=url;a.download="貼貼研究社_10x15cm_出貨單.pdf";a.style.display="inline-block";status(`產生完成 ✓\n${orders.length} 筆訂單，共 ${totalPages} 張 10×15cm。\n現在請按綠色「③ 下載 10×15cm PDF」。`)}catch(e){fail(e)}finally{$("make").disabled=false}};
</script>
</body>
</html>
